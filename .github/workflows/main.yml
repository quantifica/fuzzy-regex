name: Build and Publish to npm

on:
  push:
    branches:
      - main

jobs:
  # The published package contains no native code: src/generated/tre-wasm.ts is
  # committed, so publishing needs neither Emscripten nor a C toolchain. This job
  # is what keeps that safe. It rebuilds the wasm from vendor/tre and runs the
  # suite against the rebuilt artifact, so a change to bindings/tre_wasm.c or
  # vendor/tre that was never regenerated fails here.
  #
  # The check is functional rather than a byte comparison: emcc output differs
  # between toolchain versions, so requiring the committed bytes to match this
  # runner's emcc would fail on an unrelated Emscripten bump. A byte difference
  # is reported as a notice instead. The emcc version that produced the committed
  # artifact is recorded in its header.
  verify-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          # Pinned rather than "latest": this job gates publishing, so an
          # upstream Emscripten release must not be able to break a release on
          # its own. Bump deliberately; the test step below is what validates a
          # new version.
          version: 6.0.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Rebuild wasm from source
        run: ./scripts/build-wasm.sh
      - name: Test against the freshly built wasm
        run: npm run test
      - name: Report whether the committed artifact matches this toolchain
        run: |
          if git diff --quiet -- src/generated/tre-wasm.ts; then
            echo "src/generated/tre-wasm.ts is byte-identical to a fresh build."
          else
            echo "::notice::src/generated/tre-wasm.ts differs from a build with" \
              "this runner's emcc. Tests pass against the rebuild, so this is" \
              "expected after an Emscripten version change. Run" \
              "./scripts/build-wasm.sh locally and commit if you want them to match."
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

  # Publishes via npm trusted publishing (OIDC). There is no npm token: npm
  # exchanges a short-lived GitHub OIDC token for publish credentials, so there
  # is no long-lived secret to expire or leak. This requires a matching trusted
  # publisher to be registered on npmjs.com for the fuzzy-regex package:
  #
  #   Package -> Settings -> Trusted Publisher -> GitHub Actions
  #     Organization or user: quantifica
  #     Repository:           fuzzy-regex
  #     Workflow filename:    main.yml     <- basename only, must match this file
  #     Environment:          (leave blank)
  #
  # npm does not validate that configuration when it is saved, so a mismatch in
  # any of those fields surfaces only here, as a 404 on publish.
  publish:
    needs: [verify-wasm, build]
    runs-on: ubuntu-latest
    permissions:
      # Mints the OIDC token npm exchanges for publish credentials. Without it,
      # npm finds no credentials and the registry answers 404.
      id-token: write
      # ncipollo/release-action below creates the tag and GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Required even without a token: this writes the .npmrc that points npm
          # at the registry it should authenticate against.
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1, which is newer than the npm
      # bundled with Node 22. Pin the floor rather than inheriting whatever the
      # runner ships, so a runner image change cannot silently break publishing.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - name: Replace version number
        run: sed -i s#__PATCH_VERSION__#${{ github.run_number }}# package.json
      # No NODE_AUTH_TOKEN. npm detects the OIDC token and also generates
      # provenance attestations automatically, so --provenance is not needed.
      - run: npm publish
      - uses: ncipollo/release-action@v1
        with:
          commit: ${{ github.sha }}
          tag: v3.0.${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
